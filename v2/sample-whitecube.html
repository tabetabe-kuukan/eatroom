<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホワイトキューブ（サンプル）</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #info { position: fixed; left: 16px; top: 14px; max-width: 540px; font-size: 13px; line-height: 1.6; color: #eee; background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 6px; }
  #hit { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); font-size: 15px; color: #fff; background: rgba(0,0,0,.6); padding: 8px 16px; border-radius: 6px; opacity: 0; transition: opacity .4s; }
  #hit.show { opacity: 1; }
  #stick { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="info">
  <b>サンプル：ホワイトキューブ（Blender で作り、光をベイク）</b><br>
  白い展示室が3つ続きます（第1〜第3区画）。名詞はオブジェクトを壁や台に埋め込み、
  抽象的な言葉は張り紙・新聞・書類の中の言葉として置いています（ここでは見本の単語）。<br>
  クリックで操作開始 / WASD で移動 / マウスで視点 / Shift で走る
</div>
<div id="hit"></div>
<div id="stick"><i id="knob"></i></div>
<script type="module" src="./src/sample-whitecube.js"></script>
</body>
</html>
